server {
    listen 80;
    server_name lvhaorankk.top www.lvhaorankk.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lvhaorankk.top www.lvhaorankk.top;

    ssl_certificate     /etc/letsencrypt/live/lvhaorankk.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lvhaorankk.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # MinIO 图片走同域名 443，避免微信小程序 downloadFile 域名不能带端口。
    location ^~ /files/ {
        proxy_pass https://minio:9000/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name lvhaorankk.top;
        proxy_ssl_verify off;
        proxy_set_header Host lvhaorankk.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
