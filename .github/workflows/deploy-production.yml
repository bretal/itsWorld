name: Deploy frontend and backend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'server/**'
      - 'deploy/prod/release.sh'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itsworld-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Build backend
        working-directory: server
        run: mvn --batch-mode -Pprod -DskipTests package
      - name: Package release
        run: |
          mkdir release
          cp server/target/its-world-server-1.0.0.jar release/app.jar
          tar -C frontend -czf release/frontend.tar.gz dist
          cp deploy/prod/release.sh release/
          cd release
          sha256sum app.jar frontend.tar.gz release.sh > SHA256SUMS
      - name: Publish release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          : "${DEPLOY_HOST:?}" "${DEPLOY_USER:?}" "${DEPLOY_KEY:?}" "${DEPLOY_KNOWN_HOSTS:?}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          opts=(-i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts")
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_dir="/opt/itsworld/releases/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "${opts[@]}" "$target" "umask 077 && mkdir '$remote_dir'"
          scp "${opts[@]}" release/* "$target:$remote_dir/"
          ssh "${opts[@]}" "$target" "bash '$remote_dir/release.sh' '$remote_dir'"
